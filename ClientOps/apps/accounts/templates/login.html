<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Login </title>
</head>
<html lang="en">
<body>
    {% block content %}
    {% if messages %}
    <div>
        {% for message in messages %}
        <div {% if message.tags %} class="alert-{{ message.tags}}}" {% endif %}></div>
        {% endfor %}
    </div>
    {% endif %}
    <form action="{% url 'accounts:login' %}" method="post">
        {% csrf_token %}
        <div>
            <label>
                Email
            </label>
                {{ form.username }}
                {{ form.username.error }}

        </div>
        <div>
            <label >
                Password:
            {{ form.password }}
        </label>
        </div>
        <div class="grid">
            <button type="submit">Submit</button>
        </div>
    </form>
    {% endblock %}

</body>
</html>
