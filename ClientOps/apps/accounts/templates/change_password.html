<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% block content %}
<form method="POST" action ="{% url 'accounts:change_password' %}">
    {% csrf_token %}
<div>
    <label>
        Password
        {{ form.old_password }}
    </label>
    <span {{ form.errors.old_password }} ></span>
</div>

<div>
    <label>
        New Passwor
            {{ form.new_password }}
    </label>
    <span {{ form.errors.new_password }}></span>
</div>

<div>
    <label>
         Confirm New Password
                {{ form.new_password1 }}

    </label>
    <span {{ form.errors.new_password1}}></span>

</div>
    <div class="grid">
        <button type="submit"> SUBMIT</button>



    </div>

</form>
{% endblock %}
</body>
</html>
