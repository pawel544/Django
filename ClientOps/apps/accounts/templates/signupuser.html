<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>signupuser</title>

</head>

<body>
{% block content %}


<form method="POST" action="{% url 'accounts:signupuser' %}">
    {% csrf_token %}
    <div>
        <label> Email
            {{ form.email }}
        </label>
        <span {{ form.errors.email }} ></span>
    </div>



    <div>
        <label> First Name
            {{ form.first_name }}
        </label>
        <span {{ form.errors.first_name }}></span>



        <label> Last Name
            {{ form.errors.last_name }}
        </label>
        <span {{ form.errors.last_name }}></span>


        <label> Password
            {{ form.password1 }}
        </label>
        <span {{ form.errors.password1 }}></span>
        <label> Confirm Password
            {{ form.password2 }}
        </label>
        <span {{ form.errors.password2 }}></span>
    </div>
    <div class="gird">
        <button type="submit"> SUBMIT</button>
    </div>
</form>
{% endblock %)
</body>
</html>
